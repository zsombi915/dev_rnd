<style>
/* ===================================================================== */
/*  STÍLUS                                                               */
/* ===================================================================== */
:root{
  --magenta-deep:#5c0030;
  --magenta:#c2185b;
  --magenta-bright:#ff2d95;
  --magenta-soft:#e0559a;
  --ink:#120009;
  --white:#ffffff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;margin:0;padding:0;overflow:hidden;overscroll-behavior:none;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  background:radial-gradient(circle at 50% 22%, var(--magenta) 0%, #8e0040 45%, var(--magenta-deep) 100%);
  color:var(--white);
  display:flex;flex-direction:column;align-items:center;
  justify-content:space-between;
  padding:calc(env(safe-area-inset-top) + 22px) 18px calc(env(safe-area-inset-bottom) + 20px);
  text-align:center;
  user-select:none;-webkit-user-select:none;
  touch-action:manipulation;
}

/* --- fejléc --- */
header{flex:0 0 auto;}
h1{
  margin:0;
  font-size:clamp(30px,9vw,54px);
  font-weight:800;
  letter-spacing:.02em;
  color:var(--white);
  text-shadow:0 2px 0 rgba(0,0,0,.35), 0 0 26px rgba(255,45,149,.55);
}
.sub{
  margin:6px 0 0;
  font-size:clamp(11px,3.2vw,14px);
  letter-spacing:.22em;
  text-transform:uppercase;
  color:rgba(255,255,255,.62);
  font-weight:600;
}

/* --- a golyó --- */
.stage{flex:1 1 auto;display:flex;align-items:center;justify-content:center;width:100%;}
.ball{
  position:relative;
  width:min(78vw,320px);
  height:min(78vw,320px);
  border-radius:50%;
  background:
    radial-gradient(circle at 32% 26%, #ff8cc4 0%, var(--magenta-bright) 22%, var(--magenta) 52%, #8e0040 78%, #4a0026 100%);
  box-shadow:
    inset -14px -20px 44px rgba(0,0,0,.55),
    inset 12px 14px 40px rgba(255,255,255,.20),
    0 22px 45px rgba(0,0,0,.45),
    0 0 70px rgba(255,45,149,.30);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  transition:transform .18s ease;
}
.ball::after{ /* fénycsillanás */
  content:"";position:absolute;top:11%;left:20%;
  width:26%;height:17%;border-radius:50%;
  background:rgba(255,255,255,.42);
  filter:blur(9px);pointer-events:none;
}
.ball:active{transform:scale(.97);}

/* fehér korong + fekete ablak */
.window{
  position:relative;
  width:62%;height:62%;
  border-radius:50%;
  background:var(--white);
  box-shadow:inset 0 3px 10px rgba(0,0,0,.28), 0 3px 12px rgba(0,0,0,.35);
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}
.window::before{ /* fekete háromszög-ablak */
  content:"";position:absolute;inset:0;margin:auto;
  width:100%;height:100%;
  background:var(--ink);
  clip-path:polygon(50% 4%, 96% 88%, 4% 88%);
  opacity:.96;
}
#answer{
  position:relative;z-index:2;
  width:74%;
  margin-top:9%;
  font-size:clamp(11px,3.5vw,17px);
  line-height:1.32;
  font-weight:700;
  color:var(--white);
  opacity:0;
  transform:scale(.82);
  transition:opacity .45s ease, transform .45s cubic-bezier(.2,1.4,.4,1);
  text-wrap:balance;
  hyphens:auto;
}
#answer.show{opacity:1;transform:scale(1);}

/* rázás animáció */
@keyframes shakeit{
  0%,100%{transform:translate(0,0) rotate(0);}
  15%{transform:translate(-11px,5px) rotate(-5deg);}
  30%{transform:translate(10px,-7px) rotate(4deg);}
  45%{transform:translate(-8px,-4px) rotate(-3deg);}
  60%{transform:translate(7px,6px) rotate(3deg);}
  80%{transform:translate(-4px,2px) rotate(-1deg);}
}
.ball.shaking{animation:shakeit .62s ease;}

/* --- lábléc / gomb --- */
footer{flex:0 0 auto;width:100%;max-width:420px;}
.hint{
  font-size:clamp(12px,3.6vw,15px);
  color:rgba(255,255,255,.78);
  min-height:1.4em;
  margin:0 0 12px;
  font-weight:500;
}
button{
  font-family:inherit;
  font-size:15px;font-weight:700;
  color:var(--magenta-deep);
  background:var(--white);
  border:0;border-radius:999px;
  padding:14px 30px;
  cursor:pointer;
  box-shadow:0 6px 18px rgba(0,0,0,.35);
  letter-spacing:.02em;
}
button:active{transform:translateY(1px);}
button[hidden]{display:none;}
</style>
</head>
<body>

<header>
  <h1>Dóraságok</h1>
  <p class="sub">Rázd meg &middot; és megtudod</p>
</header>

<div class="stage">
  <div class="ball" id="ball" role="button" tabindex="0" aria-label="Jóslat kérése">
    <div class="window"><div id="answer"></div></div>
  </div>
</div>

<footer>
  <p class="hint" id="hint">Rázd meg a telefont, vagy koppints a golyóra</p>
  <button id="motionBtn" hidden>Rázás bekapcsolása</button>
</footer>

<script>
/* ===================================================================== */
/*  ITT SZERKESZTHETŐK A JÓKÍVÁNSÁGOK                                    */
/*  Csak írj új sorokat közéjük, idézőjelben, vesszővel elválasztva.     */
/* ===================================================================== */
const WISHES = [
  "Ma valami szép fog történni veled.",
  "Egy régi ismerős gondol rád éppen most.",
  "A mai napod tele lesz apró csodákkal.",
  "Amit ma elkezdesz, sikerülni fog.",
  "Valaki hamarosan megmosolyogtat.",
  "A szerencse ma melletted áll.",
  "Egy jó hír van úton feléd.",
  "Ma te leszel valakinek a legszebb pillanata.",
  "Bátran mondj igent arra, amitől félsz.",
  "A nevetésed ma valakinek gyógyír lesz.",
  "Minden úgy alakul, ahogy a legjobb neked.",
  "Ma megérdemled, hogy kényeztesd magad.",
  "Egy régóta várt dolog végre megmozdul.",
  "A világ ma kedves lesz hozzád.",
  "Amire vágysz, közelebb van, mint hiszed.",
  "Ma valaki büszke lesz rád.",
  "Engedd el, ami nyomaszt – nem a tiéd.",
  "A következő hét meglepetést tartogat.",
  "Elég vagy. Pontosan így, ahogy vagy.",
  "Ma egy véletlen találkozás jót hoz.",
  "A kávéd ma tökéletes lesz.",
  "Amit ma kívánsz, jegyezd meg – teljesülni fog.",
  "Ma könnyebb lesz, mint tegnap.",
  "Valaki ma titokban hálás neked.",
  "Az utad jó irányba visz, csak menj tovább.",
  "Ma jár neked egy nagy ölelés.",
  "A holnap fényesebb, mint amire számítasz.",
  "Egy régi álmod újra elérhető közelségbe kerül.",
  "Ma minden ajtó nyitva áll előtted.",
  "A türelmed hamarosan meghozza a gyümölcsét.",
  "Ma valami olyat tanulsz, ami sokáig veled marad.",
  "Boldogság vár rád ott, ahol nem is keresed.",
  "A mai naptól kezdve könnyebb lesz.",
  "Ne aggódj – ez is megoldódik magától.",
  "Ma ragyogsz, akár észreveszed, akár nem.",
  "Egy kedves szó ma megváltoztatja a napodat.",
  "A szíved ma jól fog dönteni.",
  "Ma valami régóta halogatott dolog végre kipipálódik.",
  "Az élet ma egy kis ajándékot csempész az utadba.",
  "Bízz magadban – tudod te a választ."
];
/* ===================================================================== */
/*  Innentől már nem kell szerkeszteni semmit.                           */
/* ===================================================================== */

(function () {
  "use strict";

  const ball      = document.getElementById("ball");
  const answerEl  = document.getElementById("answer");
  const hintEl    = document.getElementById("hint");
  const motionBtn = document.getElementById("motionBtn");

  /* --- ismétlés nélküli sorsolás: kevert lista, kimerülésig --- */
  let queue = [];
  function refill() {
    const last = answerEl.textContent;
    queue = WISHES.slice();
    for (let i = queue.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [queue[i], queue[j]] = [queue[j], queue[i]];
    }
    // ne ugyanazzal induljon, mint ami épp látszik
    if (queue.length > 1 && queue[queue.length - 1] === last) {
      [queue[0], queue[queue.length - 1]] = [queue[queue.length - 1], queue[0]];
    }
  }
  function nextWish() {
    if (!queue.length) refill();
    return queue.pop();
  }
  refill();

  /* --- jóslat megjelenítése --- */
  let busy = false;
  function reveal() {
    if (busy || !WISHES.length) return;
    busy = true;

    answerEl.classList.remove("show");
    ball.classList.remove("shaking");
    void ball.offsetWidth;              // reflow, hogy újrainduljon az animáció
    ball.classList.add("shaking");

    if (navigator.vibrate) { try { navigator.vibrate([28, 55, 28]); } catch (e) {} }

    setTimeout(function () {
      answerEl.textContent = nextWish();
      answerEl.classList.add("show");
      busy = false;
    }, 430);
  }

  /* --- koppintás / billentyű --- */
  ball.addEventListener("click", reveal);
  ball.addEventListener("keydown", function (e) {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); reveal(); }
  });

  /* --- rázás érzékelése --- */
  const THRESHOLD = 15;      // érzékenység: kisebb szám = érzékenyebb
  const COOLDOWN  = 1100;    // ms, két rázás között
  let lastShake = 0;
  let lx = null, ly = null, lz = null;

  function onMotion(e) {
    const a = e.accelerationIncludingGravity || e.acceleration;
    if (!a || a.x === null) return;
    if (lx === null) { lx = a.x; ly = a.y; lz = a.z; return; }

    const delta = Math.abs(a.x - lx) + Math.abs(a.y - ly) + Math.abs(a.z - lz);
    lx = a.x; ly = a.y; lz = a.z;

    const now = Date.now();
    if (delta > THRESHOLD && now - lastShake > COOLDOWN) {
      lastShake = now;
      reveal();
    }
  }

  function startMotion() {
    window.addEventListener("devicemotion", onMotion, { passive: true });
    hintEl.textContent = "Rázd meg a telefont!";
    motionBtn.hidden = true;
  }

  const hasMotion = typeof DeviceMotionEvent !== "undefined";
  const needsPermission = hasMotion && typeof DeviceMotionEvent.requestPermission === "function";

  if (needsPermission) {
    // iOS 13+ : felhasználói gomb kell hozzá
    motionBtn.hidden = false;
    hintEl.textContent = "Koppints a golyóra – vagy kapcsold be a rázást";
    motionBtn.addEventListener("click", function () {
      DeviceMotionEvent.requestPermission().then(function (state) {
        if (state === "granted") {
          startMotion();
        } else {
          motionBtn.hidden = true;
          hintEl.textContent = "Rázás nem elérhető – koppints a golyóra";
        }
      }).catch(function () {
        motionBtn.hidden = true;
        hintEl.textContent = "Rázás nem elérhető – koppints a golyóra";
      });
    });
  } else if (hasMotion) {
    startMotion();
    hintEl.textContent = "Rázd meg a telefont, vagy koppints a golyóra";
  } else {
    hintEl.textContent = "Koppints a golyóra";
  }

  /* --- kezdőállapot --- */
  answerEl.textContent = "Rázz meg!";
  answerEl.classList.add("show");

  /* --- ne ugráljon / ne zoomoljon a lap iOS-en --- */
  document.addEventListener("gesturestart", function (e) { e.preventDefault(); });
  document.addEventListener("touchmove", function (e) {
    if (e.touches.length > 1) e.preventDefault();
  }, { passive: false });
})();
</script>
</body>
</html>
