<title>Dóraságok</title>

<style>
/* ===================================================================== */
/*  STÍLUS                                                               */
/* ===================================================================== */
:root{
  --magenta-deep:#5c0030;
  --magenta:#c2185b;
  --magenta-bright:#ff2d95;
  --ink:#0d0006;
  --white:#ffffff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;margin:0;padding:0;overflow:hidden;overscroll-behavior:none;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  background:radial-gradient(circle at 50% 22%, var(--magenta) 0%, #8e0040 45%, var(--magenta-deep) 100%);
  background-attachment:fixed;
  color:var(--white);
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  padding:calc(env(safe-area-inset-top) + 22px) 18px calc(env(safe-area-inset-bottom) + 20px);
  text-align:center;
  user-select:none;-webkit-user-select:none;
  touch-action:manipulation;
}

/* --- fejléc --- */
header{flex:0 0 auto;}
h1{
  margin:0;
  font-size:clamp(30px,9vw,54px);
  font-weight:800;
  letter-spacing:.02em;
  text-shadow:0 2px 0 rgba(0,0,0,.35), 0 0 26px rgba(255,45,149,.55);
}
.sub{
  margin:6px 0 0;
  font-size:clamp(11px,3.2vw,14px);
  letter-spacing:.22em;
  text-transform:uppercase;
  color:rgba(255,255,255,.62);
  font-weight:600;
}

/* --- a golyó --- */
.stage{flex:1 1 auto;display:flex;align-items:center;justify-content:center;width:100%;}
.ball{
  position:relative;
  width:min(78vw,320px);
  height:min(78vw,320px);
  border-radius:50%;
  background:radial-gradient(circle at 32% 26%, #ff8cc4 0%, var(--magenta-bright) 22%, var(--magenta) 52%, #8e0040 78%, #4a0026 100%);
  box-shadow:
    inset -14px -20px 44px rgba(0,0,0,.55),
    inset 12px 14px 40px rgba(255,255,255,.20),
    0 22px 45px rgba(0,0,0,.45),
    0 0 70px rgba(255,45,149,.30);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  transition:transform .18s ease;
}
.ball::after{ /* fénycsillanás */
  content:"";position:absolute;top:11%;left:20%;
  width:26%;height:17%;border-radius:50%;
  background:rgba(255,255,255,.42);
  filter:blur(9px);pointer-events:none;
}
.ball:active{transform:scale(.97);}

/* fekete középkorong, vékony fehér gyűrűvel */
.window{
  position:relative;
  width:66%;height:66%;
  border-radius:50%;
  background:radial-gradient(circle at 42% 34%, #241019 0%, var(--ink) 62%, #000 100%);
  box-shadow:
    0 0 0 3px rgba(255,255,255,.92),
    0 0 0 7px rgba(0,0,0,.18),
    inset 0 6px 18px rgba(0,0,0,.85);
  display:flex;align-items:center;justify-content:center;
  padding:9%;
  overflow:hidden;
}
#answer{
  width:100%;
  font-size:clamp(13px,4.3vw,21px);
  line-height:1.3;
  font-weight:700;
  color:var(--white);
  opacity:0;
  transform:scale(.82);
  transition:opacity .45s ease, transform .45s cubic-bezier(.2,1.4,.4,1);
  text-wrap:balance;
  hyphens:auto;
  text-shadow:0 1px 3px rgba(0,0,0,.6);
}
#answer.show{opacity:1;transform:scale(1);}

/* rázás animáció */
@keyframes shakeit{
  0%,100%{transform:translate(0,0) rotate(0);}
  15%{transform:translate(-11px,5px) rotate(-5deg);}
  30%{transform:translate(10px,-7px) rotate(4deg);}
  45%{transform:translate(-8px,-4px) rotate(-3deg);}
  60%{transform:translate(7px,6px) rotate(3deg);}
  80%{transform:translate(-4px,2px) rotate(-1deg);}
}
.ball.shaking{animation:shakeit .62s ease;}

/* --- lábléc --- */
footer{flex:0 0 auto;width:100%;max-width:420px;}
.hint{
  font-size:clamp(12px,3.6vw,15px);
  color:rgba(255,255,255,.78);
  min-height:1.4em;margin:0 0 12px;font-weight:500;
}
/* iOS haptika-trükk: a kapcsolónak a DOM-ban kell lennie, de nem látszik.
   NE tedd display:none-ra, mert akkor nem vált ki rezgést. */
.haptic{
  position:fixed;bottom:0;left:0;
  width:1px;height:1px;opacity:.01;
  pointer-events:none;border:0;margin:0;padding:0;
  appearance:none;-webkit-appearance:none;
}
</style>
</head>
<body>

<header>
  <h1>Dóraságok</h1>
  <p class="sub">Rázd meg &middot; és megtudod</p>
</header>

<div class="stage">
  <div class="ball" id="ball" role="button" tabindex="0" aria-label="Jóslat kérése">
    <div class="window"><div id="answer" aria-live="polite"></div></div>
  </div>
</div>

<footer>
  <p class="hint" id="hint">Rázd meg a telefont, vagy koppints a golyóra</p>
</footer>

<!-- iOS 17.4+ haptika: ennek a kapcsolónak a programozott átbillentése rezgést vált ki -->
<input class="haptic" id="haptic" type="checkbox" switch tabindex="-1" aria-hidden="true">

<script>
/* ===================================================================== */
/*  ITT SZERKESZTHETŐK A JÓKÍVÁNSÁGOK                                    */
/*  Új sort idézőjelben, a végén vesszővel. Ennyi.                       */
/* ===================================================================== */
const WISHES = [
  "Ma valami szép fog történni veled.",
  "Egy régi ismerős gondol rád éppen most.",
  "A mai napod tele lesz apró csodákkal.",
  "Amit ma elkezdesz, sikerülni fog.",
  "Valaki hamarosan megmosolyogtat.",
  "A szerencse ma melletted áll.",
  "Egy jó hír van úton feléd.",
  "Ma te leszel valakinek a legszebb pillanata.",
  "Bátran mondj igent arra, amitől félsz.",
  "A nevetésed ma valakinek gyógyír lesz.",
  "Minden úgy alakul, ahogy a legjobb neked.",
  "Ma megérdemled, hogy kényeztesd magad.",
  "Egy régóta várt dolog végre megmozdul.",
  "A világ ma kedves lesz hozzád.",
  "Amire vágysz, közelebb van, mint hiszed.",
  "Ma valaki büszke lesz rád.",
  "Engedd el, ami nyomaszt – nem a tiéd.",
  "A következő hét meglepetést tartogat.",
  "Elég vagy. Pontosan így, ahogy vagy.",
  "Ma egy véletlen találkozás jót hoz.",
  "A kávéd ma tökéletes lesz.",
  "Amit ma kívánsz, jegyezd meg – teljesülni fog.",
  "Ma könnyebb lesz, mint tegnap.",
  "Valaki ma titokban hálás neked.",
  "Az utad jó irányba visz, csak menj tovább.",
  "Ma jár neked egy nagy ölelés.",
  "A holnap fényesebb, mint amire számítasz.",
  "Egy régi álmod újra elérhető közelségbe kerül.",
  "Ma minden ajtó nyitva áll előtted.",
  "A türelmed hamarosan meghozza a gyümölcsét.",
  "Ma valami olyat tanulsz, ami sokáig veled marad.",
  "Boldogság vár rád ott, ahol nem is keresed.",
  "A mai naptól kezdve könnyebb lesz.",
  "Ne aggódj – ez is megoldódik magától.",
  "Ma ragyogsz, akár észreveszed, akár nem.",
  "Egy kedves szó ma megváltoztatja a napodat.",
  "A szíved ma jól fog dönteni.",
  "Ma valami régóta halogatott dolog végre kipipálódik.",
  "Az élet ma egy kis ajándékot csempész az utadba.",
  "Bízz magadban – tudod te a választ."
];
/* ===================================================================== */
/*  Innentől nem kell szerkeszteni semmit.                               */
/* ===================================================================== */

(function () {
  "use strict";

  var ball      = document.getElementById("ball");
  var answerEl  = document.getElementById("answer");
  var hintEl    = document.getElementById("hint");
  var hapticEl  = document.getElementById("haptic");

  /* --- ismétlés nélküli sorsolás --- */
  var queue = [], lastShown = null;
  function refill() {
    queue = WISHES.slice();
    for (var i = queue.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = queue[i]; queue[i] = queue[j]; queue[j] = t;
    }
    if (queue.length > 1 && queue[queue.length - 1] === lastShown) {
      var s = queue[0]; queue[0] = queue[queue.length - 1]; queue[queue.length - 1] = s;
    }
  }
  function nextWish() {
    if (!queue.length) refill();
    lastShown = queue.pop();
    return lastShown;
  }
  refill();

  /* --- rezgés ---
     Androidon a Vibration API-t használjuk. Az iOS Safari nem támogatja,
     ott az iOS 17.4+ „switch" vezérlő átbillentése ad egy apró koppanást. */
  function haptic() {
    if (navigator.vibrate) {
      try { if (navigator.vibrate(35) !== false) return; } catch (e) {}
    }
    if (hapticEl) {
      try {
        hapticEl.checked = !hapticEl.checked;
        hapticEl.dispatchEvent(new Event("change", { bubbles: true }));
      } catch (e) {}
    }
  }

  /* --- jóslat --- */
  var busy = false;
  function reveal() {
    if (busy || !WISHES.length) return;
    busy = true;

    haptic();

    answerEl.classList.remove("show");
    ball.classList.remove("shaking");
    void ball.offsetWidth;
    ball.classList.add("shaking");

    setTimeout(function () {
      answerEl.textContent = nextWish();
      answerEl.classList.add("show");
      busy = false;
    }, 430);
  }

  ball.addEventListener("click", reveal);
  ball.addEventListener("keydown", function (e) {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); reveal(); }
  });

  /* --- rázás --- */
  var THRESHOLD = 15;     // kisebb szám = érzékenyebb
  var COOLDOWN  = 1100;   // ms két rázás között
  var lastShake = 0, lx = null, ly = null, lz = null;

  function onMotion(e) {
    var a = e.accelerationIncludingGravity || e.acceleration;
    if (!a || a.x === null || a.x === undefined) return;
    if (lx === null) { lx = a.x; ly = a.y; lz = a.z; return; }
    var delta = Math.abs(a.x - lx) + Math.abs(a.y - ly) + Math.abs(a.z - lz);
    lx = a.x; ly = a.y; lz = a.z;
    var now = Date.now();
    if (delta > THRESHOLD && now - lastShake > COOLDOWN) { lastShake = now; reveal(); }
  }

  var motionOn = false;
  function startMotion() {
    if (motionOn) return;
    motionOn = true;
    window.addEventListener("devicemotion", onMotion, { passive: true });
    hintEl.textContent = "Rázd meg a telefont!";
  }
  function noMotion() {
    hintEl.textContent = "Koppints a golyóra";
  }

  var hasMotion = typeof DeviceMotionEvent !== "undefined";
  var needsPerm = hasMotion && typeof DeviceMotionEvent.requestPermission === "function";

  if (needsPerm) {
    /* iOS 13+ : a rendszer megköveteli, hogy az engedélykérés felhasználói
       koppintásból induljon – automatikusan, betöltéskor nem lehet.
       Ezért nincs külön „Bekapcsolás" gomb: az első koppintás bárhol a
       képernyőn elindítja a kérdést. Ha nem kap engedélyt, marad a koppintás. */
    var pending = false;
    function requestMotion(auto) {
      if (motionOn || pending) return;
      pending = true;
      var p;
      try { p = DeviceMotionEvent.requestPermission(); }
      catch (e) { pending = false; return; }
      p.then(function (state) {
        if (state === "granted") { startMotion(); haptic(); }
        else if (auto) { pending = false; }     // gesztussal még újrapróbáljuk
        else { noMotion(); }
      }).catch(function () {
        pending = false;                        // gesztus kellett hozzá
      });
    }

    hintEl.textContent = "Koppints a golyóra – utána rázhatod is";

    // 1) betöltéskor megpróbáljuk (ha korábban már engedélyezte, azonnal megy)
    requestMotion(true);

    // 2) az első bármilyen koppintás kiváltja a rendszer kérdését
    ["pointerup", "touchend", "click"].forEach(function (evt) {
      document.addEventListener(evt, function () { requestMotion(false); }, { passive: true });
    });
  } else if (hasMotion) {
    startMotion();
    hintEl.textContent = "Rázd meg a telefont, vagy koppints a golyóra";
  } else {
    noMotion();
  }

  /* --- kezdőállapot --- */
  answerEl.textContent = "Rázz meg!";
  answerEl.classList.add("show");

  /* --- iOS: ne zoomoljon, ne ugráljon --- */
  document.addEventListener("gesturestart", function (e) { e.preventDefault(); });
  document.addEventListener("touchmove", function (e) {
    if (e.touches.length > 1) e.preventDefault();
  }, { passive: false });

  /* --- telepíthetőség: manifest beágyazva, nem kell külön fájl --- */
  try {
    var icon = document.querySelector("link[rel='apple-touch-icon']").getAttribute("href");
    var manifest = {
      name: "Dóraságok", short_name: "Dóraságok",
      start_url: ".", display: "standalone",
      background_color: "#5c0030", theme_color: "#5c0030",
      icons: [{ src: icon, sizes: "180x180", type: "image/png", purpose: "any" }]
    };
    var link = document.createElement("link");
    link.rel = "manifest";
    link.href = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: "application/manifest+json" }));
    document.head.appendChild(link);
  } catch (e) {}

  /* --- offline működés, ha az sw.js is fel van töltve (ha nincs, nem baj) --- */
  if ("serviceWorker" in navigator && location.protocol === "https:") {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
})();
</script>
